services:
  - type: web
    name: chatspace-backend
    env: node
    plan: free
    buildCommand: npm install --prefix server
    startCommand: node server/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
